<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  video {
    width: 100%; height: 100%; object-fit: cover; background: transparent; display: block;
  }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>

<script>
const qs = new URLSearchParams(location.search);
const accountId = qs.get("id");
const slot = qs.get("slot") || "left";
const API = location.origin;
const video = document.getElementById("v");

if (!accountId) {
  document.body.innerHTML = "<p style='color:red;font-size:20px;padding:20px;'>Missing ?id=</p>";
  throw new Error("missing account id");
}

let pc = null;
let audioCtx = null;
let gainNode = null;
let pannerNode = null;
let remoteStream = null;
let trackedPushSessionId = null;
let pullSessionId = null;
let pendingVolume = 100;
let pendingPanning = 0;
let connecting = false;
let retryAfter = 0;

function waitForIceGathering(peerConnection, timeoutMs = 2000) {
  if (peerConnection.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const timer = setTimeout(resolve, timeoutMs);
    peerConnection.addEventListener("icegatheringstatechange", function onChange() {
      if (peerConnection.iceGatheringState === "complete") {
        clearTimeout(timer);
        peerConnection.removeEventListener("icegatheringstatechange", onChange);
        resolve();
      }
    });
  });
}

function waitForConnected(peerConnection, timeoutMs = 15000) {
  if (peerConnection.connectionState === "connected") return Promise.resolve();
  return new Promise((resolve, reject) => {
    const done = (fn, arg) => {
      clearTimeout(timer);
      peerConnection.removeEventListener("connectionstatechange", onChange);
      fn(arg);
    };
    const timer = setTimeout(
      () => done(reject, new Error("PeerConnection did not connect within " + timeoutMs + "ms")),
      timeoutMs
    );
    function onChange() {
      const st = peerConnection.connectionState;
      if (st === "connected") done(resolve);
      else if (st === "failed" || st === "closed") done(reject, new Error("PeerConnection " + st));
    }
    peerConnection.addEventListener("connectionstatechange", onChange);
  });
}

async function fetchIceServers() {
  try {
    const res = await fetch(`${API}/api/calls/ice-servers`);
    if (!res.ok) throw new Error("bad status");
    const data = await res.json();
    if (data && data.iceServers) {
      const list = Array.isArray(data.iceServers) ? data.iceServers : [data.iceServers];
      const hasTurn = list.some(e =>
        [].concat(e.urls || []).some(u => String(u).startsWith("turn:") || String(u).startsWith("turns:")));
      console.log("[pull] ICE servers:", hasTurn ? "STUN + TURN relay" : "STUN only (no TURN configured)");
      return data.iceServers;
    }
  } catch {}
  return [{ urls: ["stun:stun.cloudflare.com:3478"] }];
}

function ensureAudioGraph() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gainNode = audioCtx.createGain();
  pannerNode = audioCtx.createStereoPanner();
  gainNode.gain.value = pendingVolume / 100;
  pannerNode.pan.value = pendingPanning / 100;
  gainNode.connect(pannerNode).connect(audioCtx.destination);
  audioCtx.resume().catch(() => {});
}

function teardown() {
  if (pc) { try { pc.close(); } catch {} pc = null; }
  remoteStream = null;
  video.srcObject = null;
  trackedPushSessionId = null;
  pullSessionId = null;
}

async function connectTo(pushSessionId) {
  if (connecting) return;
  connecting = true;
  teardown();
  trackedPushSessionId = pushSessionId;

  const gatheredTypes = new Set();
  pc = new RTCPeerConnection({ iceServers: await fetchIceServers(), bundlePolicy: "max-bundle" });
  remoteStream = new MediaStream();
  video.srcObject = remoteStream;

  pc.addEventListener("iceconnectionstatechange", () => {
    console.log("[pull] iceConnectionState:", pc.iceConnectionState);
  });
  pc.addEventListener("icecandidate", (ev) => {
    if (ev.candidate && ev.candidate.candidate) {
      const m = / typ (\w+)/.exec(ev.candidate.candidate);
      if (m) gatheredTypes.add(m[1]);
    }
  });

  pc.ontrack = (ev) => {
    console.log("[pull] track received:", ev.track.kind, "readyState:", ev.track.readyState);
    remoteStream.addTrack(ev.track);

    if (ev.track.kind === "video") {
      // srcObject was assigned while the stream was still empty, and a track
      // added afterwards does not reliably start playback. Re-assign so the
      // element re-reads the stream, then start it explicitly. The element is
      // muted, so autoplay is permitted; audio is handled separately below via
      // the Web Audio graph, which is why sound worked while video did not.
      video.srcObject = remoteStream;
      const p = video.play();
      if (p && p.catch) p.catch(err => console.warn("[pull] video.play() rejected:", err));
    }

    if (ev.track.kind === "audio") {
      ensureAudioGraph();
      const src = audioCtx.createMediaStreamSource(new MediaStream([ev.track]));
      src.connect(gainNode);
    }
  };

  // One-shot report so a black frame can be told apart from a missing track.
  setTimeout(() => {
    if (!pc || pc.connectionState === "closed") return;
    console.log("[pull] video status:",
      "tracks=" + remoteStream.getVideoTracks().length,
      "paused=" + video.paused,
      "readyState=" + video.readyState,
      "size=" + video.videoWidth + "x" + video.videoHeight);
  }, 4000);

  try {
    // sessions/new requires an initial offer even with no local tracks —
    // this establishes the base transport; tracks are pulled in a second step.
    // We have nothing to send, but max-bundle requires at least one m-line to
    // form a BUNDLE group, so add recvonly transceivers just to get one.
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });

    await pc.setLocalDescription(await pc.createOffer());
    await waitForIceGathering(pc);

    const sessRes = await fetch(`${API}/api/calls/session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sessionDescription: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
      }),
    }).then(r => r.json());
    if (!sessRes.sessionId) throw new Error(sessRes.errorDescription || sessRes.error || "session create failed");
    pullSessionId = sessRes.sessionId;
    await pc.setRemoteDescription(sessRes.sessionDescription);

    // Calls answers /tracks with 425 until the transport is up.
    try {
      await waitForConnected(pc);
    } catch (connErr) {
      console.warn("[pull] transport never came up. candidate types gathered:",
        [...gatheredTypes].join(", ") || "none");
      throw connErr;
    }

    const tracksRes = await fetch(`${API}/api/calls/session/${pullSessionId}/tracks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tracks: [
          { location: "remote", sessionId: pushSessionId, trackName: "video" },
          { location: "remote", sessionId: pushSessionId, trackName: "audio" },
        ],
      }),
    }).then(r => r.json());

    if (tracksRes.errorCode || tracksRes.error) throw new Error(tracksRes.errorDescription || tracksRes.error);

    if (tracksRes.requiresImmediateRenegotiation) {
      await pc.setRemoteDescription(tracksRes.sessionDescription);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await fetch(`${API}/api/calls/session/${pullSessionId}/renegotiate`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionDescription: { type: answer.type, sdp: answer.sdp } }),
      });
    }
  } catch (e) {
    console.warn("Pull connect failed:", e);
    teardown();
    retryAfter = Date.now() + 5000;
  } finally {
    connecting = false;
  }
}

async function poll() {
  if (connecting || Date.now() < retryAfter) return;
  try {
    const res = await fetch(`${API}/api/camera/${accountId}/${slot}`);
    if (!res.ok) return;
    const info = await res.json();

    if (!info || !info.live) {
      if (trackedPushSessionId) teardown();
      return;
    }

    if (info.session_id !== trackedPushSessionId) {
      connectTo(info.session_id);
    }
  } catch (e) {
    console.warn("Poll error:", e);
  }
}

// Real-time volume/panning from castcams-index.html, same postMessage
// contract as the previous VDO.Ninja-based pull iframe used.
window.addEventListener("message", (ev) => {
  if (ev.data == null || typeof ev.data !== "object") return;
  if (typeof ev.data.volume === "number") {
    pendingVolume = ev.data.volume;
    if (gainNode) gainNode.gain.setTargetAtTime(pendingVolume / 100, audioCtx.currentTime, 0.05);
  }
  if (typeof ev.data.panning === "number") {
    pendingPanning = ev.data.panning;
    if (pannerNode) pannerNode.pan.setTargetAtTime(pendingPanning / 100, audioCtx.currentTime, 0.05);
  }
});

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
