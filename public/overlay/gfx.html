<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graphics OP</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: "Jefferies", Arial, sans-serif;
}

@font-face {
    font-family: "Jefferies";
    src: url("jefferies.otf") format("opentype");
    font-weight: normal;
}
@font-face {
    font-family: "Jefferies";
    src: url("jefferies bold.otf") format("opentype");
    font-weight: bold;
}

:root {
    --brand-color: rgb(10, 105, 164);
    --panel-bg: rgba(14, 14, 18, 0.94);

    /* Shoutout geometry. The toast centres itself on this band, so moving
       the shoutout moves the toast with it - change it here only. */
    --shout-top: 242px;
    --shout-height: 132px;
}

/* ══ SHOUTOUT ══════════════════════════════════════════════════════════════ */

.shout {
    position: absolute;
    top: var(--shout-top);
    height: var(--shout-height);
    min-width: 430px;
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 46px;
    z-index: 30;
    will-change: transform;
    transition: transform 0.62s cubic-bezier(0.22, 0.9, 0.28, 1);
}

/* Left panel - observers. Sits off the left wall until shown. */
#shout-left {
    left: 0;
    align-items: flex-start;
    text-align: left;
    border-left: 8px solid var(--brand-color);
    transform: translateX(-102%);
}
#shout-left.show { transform: translateX(0); }

/* Right panel - casters. Mirrored off the right wall. */
#shout-right {
    right: 0;
    align-items: flex-end;
    text-align: right;
    border-right: 8px solid var(--brand-color);
    transform: translateX(102%);
    transition-delay: 0.08s;
}
#shout-right.show { transform: translateX(0); }

.shout-label {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;
    color: var(--brand-color);
    text-transform: uppercase;
    margin-bottom: 8px;
    white-space: nowrap;
}

.shout-names {
    display: flex;
    gap: 26px;
    align-items: baseline;
    white-space: nowrap;
}
/* Right side is mirrored in layout, but names keep their entered order
   so "Caster 1" always reads first. */

.shout-name {
    font-size: 40px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 1px;
}

/* thin divider dot between two names */
.shout-dot {
    width: 8px;
    height: 8px;
    background: var(--brand-color);
    border-radius: 50%;
    align-self: center;
}

/* ══ CASTER TAGS ═══════════════════════════════════════════════════════════

   One name tag under each caster cam. The artwork is a single PNG (the dark
   logo block plus the blue wave panel); only the name is drawn by this page,
   sitting in the panel to the right of the logo block.

   Geometry is measured off the New Dawn duo-cam frame, which puts the cam
   windows at x 59-889 and x 1008-1838 with their bottom edge at y 776, and
   the bottom bar starting at y 998. Each tag is centred under its own cam and
   sits in the middle of that 222px gap. Change --tag-top to move both.

   The artwork is 600x153 including the light grey trim down its right side
   and along its bottom, which is part of the design. The blue panel the name
   sits in ends at x 588, where that trim begins, so the name is fitted to the
   panel rather than to the full width of the file.

   These are a toggle, not a timed graphic, so they also have to survive a
   browser-source refresh mid-show: see the no-anim path in applyGfx.        */

:root {
    --tag-w: 600px;
    --tag-h: 153px;
    --tag-top: 810px;
}

/* The panel measured off the artwork, as fractions of the file rather than
   pixels, so the same tag works at caster size and at desk size without a
   second set of numbers to keep in step. The blue panel runs 157 to 588 of
   600: the end is not the file width, because the grey trim takes the last
   12px and is detail rather than panel. */
.castertag {
    --tag-text-left: 26.1667%;   /* 157 / 600 */
    --tag-text-width: 71.8333%;  /* (588 - 157) / 600 */
    --tag-text-pad: 2.6667%;     /* 16 / 600 */
    /* 46px on the 153 tall caster tag, and the same proportion on a smaller
       one. Long names still shrink from here; this is only the starting size. */
    --tag-font: calc(var(--tag-h) * 0.3007);
}

.castertag {
    position: absolute;
    top: var(--tag-top);
    width: var(--tag-w);
    height: var(--tag-h);
    --tag-text-left: 26.1667%;
    --tag-text-width: 71.8333%;
    --tag-text-pad: 2.6667%;
    --tag-font: calc(var(--tag-h) * 0.3007);
    /* Set per event preset in applyGfx, so a new series brings its own tag
       artwork without touching the layout: every set shares the same 600x153
       geometry, dark logo block to x144 and grey trim from x588. */
    background: var(--tag-art, url("caster-tag-dawn.png")) no-repeat center / 100% 100%;
    z-index: 25;
    display: flex;
    align-items: center;
    opacity: 0;
    transform: translateY(30px);
    will-change: transform, opacity;
    transition: transform 0.5s cubic-bezier(0.22, 0.9, 0.28, 1),
                opacity 0.34s ease;
}
.castertag.show { opacity: 1; transform: translateY(0); }

/* Centred under each cam window. */
#tag-left  { left: 174px; }
#tag-right { left: 1123px; transition-delay: 0.09s; }

/* Desk tags: one under each of the three desk windows, each the width of its
   own window so it reads as belonging to that cam. Measured off the same
   TripleCamDAWN artwork the cams are placed from, which is why the third is
   not the same width as the other two.

   They share one top rather than following each window's own bottom edge:
   window 3 sits 5px lower in the artwork, and a row of tags that stepped down
   by five pixels would look like a mistake rather than a design. */
.castertag.desk { --tag-top: 790px; }

#tag-d1 { left: 170px;  --tag-w: 458px; --tag-h: 117px; }
#tag-d2 { left: 735px;  --tag-w: 458px; --tag-h: 117px; transition-delay: 0.07s; }
#tag-d3 { left: 1306px; --tag-w: 445px; --tag-h: 113px; transition-delay: 0.14s; }

/* The blue panel exactly: name, handle and pronouns stacked and left aligned
   a few pixels clear of the dark logo block, rather than centred. The grey
   trim down the right side is detail rather than panel, which is why the box
   ends at 588 of 600 and not at the file width.

   Centred as a group, so a person with no handle sits in the middle of the
   panel on their own instead of hanging at the top with a hole underneath. */
.castertag-body {
    margin-left: var(--tag-text-left);
    width: var(--tag-text-width);
    height: 100%;
    padding: 0 var(--tag-text-pad);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.26s ease 0.16s;
}
.castertag.show .castertag-body { opacity: 1; }

/* Each line clips; the span inside is what shrinks. An element cannot both
   clip its content and scale itself out of trouble: overflow resolves on the
   untransformed box, so scaling the clipper just shrinks an already-cut name. */
.tag-line {
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    line-height: 1.12;
}
.tag-line span {
    display: inline-block;
    white-space: nowrap;
    color: #fff;
}

.tag-name span {
    font-size: calc(var(--tag-h) * 0.255);
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.tag-handle span {
    font-size: calc(var(--tag-h) * 0.150);
    font-weight: bold;
    letter-spacing: 1px;
    /* Per preset too: the light blue that reads well on the New Dawn panel
       disappears into the gold one. */
    color: var(--tag-handle, #7FC4F5);
}
.tag-pronouns span {
    font-size: calc(var(--tag-h) * 0.125);
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.72);
}

/* Applied for one frame when restoring state after a refresh, so the tag is
   simply there rather than animating in on a live stream. */
.castertag.no-anim,
.castertag.no-anim .castertag-body { transition: none !important; }

/* Offscreen twin, purely to measure a name's natural width. */
#tag-measure {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    top: -9999px;
    left: -9999px;
    display: inline-block;
    white-space: nowrap;
    /* Weight, tracking and case are copied from whichever line is being
       measured rather than fixed here: the three lines do not share them, and
       measuring a handle as bold uppercase would report it far too wide. */
    font-family: "Jefferies", Arial, sans-serif;
}

/* ══ TIMEOUT ═══════════════════════════════════════════════════════════════
   The banner the operator raises from the console's Timeout panel. It is a
   toggle, not a timed graphic, so it is handled the way the caster tags are:
   if it is up when the browser source reloads it comes straight back, without
   the animation. A timed graphic replaying itself is a bug; a toggle quietly
   dropping off stream is also a bug, and they need opposite handling.

   Two colours, set by whether the team that called it is attacking or
   defending, because that is the first thing anyone watching wants to know. */

#timeout {
    position: absolute;
    top: 412px;                     /* centred: (1080 - 255) / 2 */
    left: 50%;
    width: 1050px;
    height: 255px;
    margin-left: -525px;
    overflow: hidden;
    z-index: 40;
    clip-path: polygon(0 5px, 100% 0, 100% calc(100% - 5px), 0 100%);

    --to-accent: 255, 53, 73;       /* attack, FF3549 */
    --to-ghost: rgba(74, 12, 20, 0.72);

    background:
        radial-gradient(120% 180% at 22% 120%, rgba(var(--to-accent), 0.60) 0%, rgba(var(--to-accent), 0) 58%),
        radial-gradient(120% 180% at 82% 120%, rgba(var(--to-accent), 0.40) 0%, rgba(var(--to-accent), 0) 60%),
        linear-gradient(180deg, #17202f 0%, #131a27 100%);

    opacity: 0;
    transform: translateY(-20px) scale(0.985);
    transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.22, 0.9, 0.28, 1);
}

/* Defence. Only the two colours move; every dimension above is shared. */
#timeout.def {
    --to-accent: 40, 208, 145;      /* 28D091 */
    --to-ghost: rgba(8, 54, 40, 0.78);
}

#timeout.up {
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* Coming back after a source reload: already up, so no animation to replay. */
#timeout.instant { transition: none; }

/* Darkens both ends so the banner fades into gameplay rather than ending in
   a hard edge. */
.to-edge {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg,
        #0b0d12 0%, rgba(11, 13, 18, 0) 10%,
        rgba(11, 13, 18, 0) 90%, #0b0d12 100%);
}

.to-ghost {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font: bold 132px "Jefferies", Arial, sans-serif;
    letter-spacing: 0.02em;
    transform: scaleY(1.42);
    color: var(--to-ghost);
    white-space: nowrap;
}

/* Timeouts remaining, two per side. A filled box is one still in hand. */
.to-dots {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.to-dots.left  { left: 44px; }
.to-dots.right { right: 44px; }

.to-dots span {
    display: block;
    width: 15px;
    height: 15px;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.92);
}
.to-dots i {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
    opacity: 0;
    transition: opacity 0.4s ease;
}
.to-dots i.on { opacity: 1; }

.to-mid {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
}

.to-title {
    font: bold 66px "Jefferies", Arial, sans-serif;
    letter-spacing: 0.08em;
    color: #fff;
    line-height: 1;
}

.to-team {
    display: flex;
    align-items: center;
    gap: 22px;
    font: bold 27px "Jefferies", Arial, sans-serif;
    letter-spacing: 0.12em;
    color: #fff;
}

#to-logo {
    width: 76px;
    height: 76px;
    flex: none;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}
/* A team with no logo set closes the gap rather than leaving a hole. */
#to-logo.empty { display: none; }

/* ══ TOAST ═════════════════════════════════════════════════════════════════ */

#toast-wrap {
    position: absolute;
    /* Vertical centre of the shoutout band. */
    top: calc(var(--shout-top) + var(--shout-height) / 2);
    left: 960px;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    z-index: 40;
}

/* The mark - slides up into place first, stays pinned to the left edge */
#toast-mark {
    width: 116px;
    height: 116px;
    flex: 0 0 116px;
    /* Dark tile so the logo keeps its own contrast on any preset colour;
       the brand colour reads as the leading accent edge instead. */
    background: var(--panel-bg);
    border-left: 8px solid var(--brand-color);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(70px);
    transition: transform 0.42s cubic-bezier(0.22, 0.9, 0.28, 1),
                opacity 0.32s ease;
}
#toast-mark.up {
    opacity: 1;
    transform: translateY(0);
}
#toast-mark img {
    width: 76px;
    height: 76px;
    object-fit: contain;
}

/* The body - stretches out horizontally from behind the mark */
#toast-body {
    height: 116px;
    width: 0;
    overflow: hidden;
    background: var(--panel-bg);
    display: flex;
    align-items: center;
    transition: width 0.46s cubic-bezier(0.22, 0.9, 0.28, 1);
}

#toast-text {
    padding: 0 42px;
    font-size: 40px;
    font-weight: bold;
    color: #fff;
    white-space: nowrap;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.24s ease;
}
#toast-text.show { opacity: 1; }

/* Offscreen twin used purely to measure the natural text width */
#toast-measure {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    top: -9999px;
    left: -9999px;
    padding: 0 42px;
    font-size: 40px;
    font-weight: bold;
    white-space: nowrap;
    letter-spacing: 1px;
    font-family: "Jefferies", Arial, sans-serif;
}
</style>
</head>
<body>

<!-- Caster / observer shoutout -->
<div class="shout" id="shout-left">
    <div class="shout-label" id="shout-left-label">OBSERVERS</div>
    <div class="shout-names" id="shout-left-names"></div>
</div>

</div>

<!-- Caster name tags, one under each caster cam -->
<div class="castertag" id="tag-left">
  <div class="castertag-body">
    <div class="tag-line tag-name"><span id="tag-left-name"></span></div>
    <div class="tag-line tag-handle"><span id="tag-left-handle"></span></div>

    <div class="tag-line tag-pronouns"><span id="tag-right-pronouns"></span></div>
  </div>
</div>

<!-- Desk tags, up instead of the two above while desk mode is on -->
<div class="castertag desk" id="tag-d1">
  <div class="castertag-body">

    <div class="tag-line tag-handle"><span id="tag-d1-handle"></span></div>
    <div class="tag-line tag-pronouns"><span id="tag-d1-pronouns"></span></div>
  </div>
</div>
<div class="castertag desk" id="tag-d2">
  <div class="castertag-body">
    <div class="tag-line tag-name"><span id="tag-d2-name"></span></div>
    <div class="tag-line tag-handle"><span id="tag-d2-handle"></span></div>
    <div class="tag-line tag-pronouns"><span id="tag-d2-pronouns"></span></div>
  </div>
</div>
<div class="castertag desk" id="tag-d3">
  <div class="castertag-body">
    <div class="tag-line tag-name"><span id="tag-d3-name"></span></div>
    <div class="tag-line tag-handle"><span id="tag-d3-handle"></span></div>
    <div class="tag-line tag-pronouns"><span id="tag-d3-pronouns"></span></div>

<!-- Timeout banner -->

        </div>

</div>

<!-- Toast -->
<div id="toast-wrap">
    <div id="toast-mark"><img id="toast-mark-img" src="" alt=""></div>
    <div id="toast-body"><span id="toast-text"></span></div>
</div>

<span id="toast-measure"></span>

<script>
// ── Setup ───────────────────────────────────────────────────────────────────
const accountId = new URLSearchParams(location.search).get("id");
if (!accountId) {
    document.body.innerHTML =
        "<p style='color:red;padding:40px;font-size:32px;font-family:Arial;'>Missing ?id= in URL</p>";
}

const byid = (id) => document.getElementById(id);

const brandColors = {
    road2:   "#31A2EE",
    waveoce: "rgb(10, 105, 164)",
};

/* Caster tag artwork per preset, and the handle colour that reads on it. */
const tagArt = {
    road2:   "caster-tag-dawn.png",
    pheonix: "caster-tag-pheonix.png",
};
const tagHandle = {
    road2:   "#7FC4F5",
    pheonix: "#FFC46B",
};

const brandMarks = {
    road2:   "mark-1024.png",
    waveoce: "Wave OCE Rising Tides Brandmark Logo_White.png",
    blob:    "blob logo.png",
};

// ── Shoutout ────────────────────────────────────────────────────────────────
let shoutTimer = null;

function renderNames(container, names) {
    container.innerHTML = "";
    const clean = (names || []).map(n => String(n || "").trim()).filter(Boolean);
    clean.forEach((name, i) => {
        if (i > 0) {
            const dot = document.createElement("div");
            dot.className = "shout-dot";
            container.appendChild(dot);
        }
        const el = document.createElement("div");
        el.className = "shout-name";
        el.textContent = name;
        container.appendChild(el);
    });
    return clean.length;
}

function showShoutout(g) {
    clearTimeout(shoutTimer);

    byid("shout-left-label").textContent  = (g.obs_label  || "OBSERVERS").toUpperCase();
    byid("shout-right-label").textContent = (g.cast_label || "CASTERS").toUpperCase();

    const nLeft  = renderNames(byid("shout-left-names"),  g.observers);
    const nRight = renderNames(byid("shout-right-names"), g.casters);

    // A side with no names stays off screen entirely
    if (nLeft)  byid("shout-left").classList.add("show");
    if (nRight) byid("shout-right").classList.add("show");

    const dur = Math.max(1000, Number(g.duration) || 8000);
    shoutTimer = setTimeout(hideShoutout, dur);
}

function hideShoutout() {
    clearTimeout(shoutTimer);
    byid("shout-left").classList.remove("show");
    byid("shout-right").classList.remove("show");
}

// ── Caster tags ─────────────────────────────────────────────────────────────

/**
 * Fit a name inside the blue panel.
 *
 * Names run from four letters to something like "ProfessorBroccoli", so a
 * fixed size either wastes the panel or runs off the end of it. Every name
 * gets the full size if it fits; only the ones that do not are stepped down.
 *
 * The font-size is what changes, not a transform. Letter-spacing does not
 * scale with font-size, so the first guess is a ratio and then it is measured
 * again and nudged, rather than trusted.
 *
 * The starting size is whatever the CSS gives this tag rather than a constant,
 * because a desk tag is smaller than a caster tag and starting both at 46px
 * would mean every desk name arrived needing to be shrunk.
 */
function fitName(el, text) {
    el.textContent = text;
    el.style.fontSize = "";
    if (!text) return;

    const box = el.parentElement;
    // Read the padding rather than hard coding it, so moving the padding in
    // the CSS cannot quietly leave the auto-fit measuring the wrong width.
    const pad = getComputedStyle(box);
    const room = box.clientWidth
        - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight);
    if (room <= 0) return;

    const own = getComputedStyle(el);
    const base = parseFloat(own.fontSize) || 46;
    const floor = Math.max(10, Math.round(base * 0.44));

    const measure = byid("tag-measure");
    measure.style.fontWeight = own.fontWeight;
    measure.style.letterSpacing = own.letterSpacing;
    measure.style.textTransform = own.textTransform;

    const widthAt = (px) => {
        measure.style.fontSize = px + "px";
        measure.textContent = text;
        return measure.offsetWidth;
    };

    let size = base;
    let natural = widthAt(size);
    if (natural <= room) return;

    size = Math.max(floor, Math.floor(size * (room / natural)));
    // Letter-spacing is a fixed number of pixels per character, so the ratio
    // above slightly overshoots. A few single-pixel steps settle it.
    for (let i = 0; i < 12 && widthAt(size) > room && size > floor; i++) size -= 1;
    el.style.fontSize = size + "px";
}

/**
 * Re-fit once the webfont has actually loaded.
 *
 * Jefferies is a webfont, and a name measured while Arial is still standing in
 * measures narrower than it will finally draw. That is exactly how a name
 * fits during the check and is clipped on stream.
 */
if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
        for (const id of ["tag-left-name", "tag-right-name"]) {
            const el = byid(id);
            if (el.textContent) fitName(el, el.textContent);
        }
    });
}

const CASTER_TAGS = ["tag-left", "tag-right"];
const DESK_TAGS = ["tag-d1", "tag-d2", "tag-d3"];
const ALL_TAGS = [...CASTER_TAGS, ...DESK_TAGS];

/**
 * Which tags belong on screen, and what they say.
 *
 * Desk mode swaps the set: three small ones under the desk windows instead of
 * two big ones under the caster cams. There is still one toggle, because two
 * would mean remembering to flip both at the moment you are also switching
 * scenes.
 *
 * The desk names are the Label on each desk cam rather than three more fields.
 * A name typed in one place cannot disagree with itself.
 */
function tagsFor(g, camera) {
    if (camera && camera.desk) {
        const cams = camera.cams || {};
        return DESK_TAGS.map((tagId, i) => {
            const cam = cams["desk" + (i + 1)] || {};
            return [tagId, {
                name: cam.label, handle: cam.handle, pronouns: cam.pronouns,
            }];
        });
    }
    return [
        ["tag-left", { name: g.left, handle: g.leftHandle, pronouns: g.leftPronouns }],
        ["tag-right", { name: g.right, handle: g.rightHandle, pronouns: g.rightPronouns }],
    ];
}

/** A handle as it should read on air: one @, whether or not they typed it. */
function atHandle(value) {
    const clean = String(value || "").trim().replace(/^@+/, "");
    return clean ? "@" + clean : "";
}

function showTags(g, instant = false, camera = null) {
    const wanted = tagsFor(g, camera);
    const shown = new Set(wanted.map(([tagId]) => tagId));

    // Whichever set is not in use goes away, or switching into desk mode would
    // leave the caster tags sitting over the top of it.
    for (const tagId of ALL_TAGS) {
        if (!shown.has(tagId)) byid(tagId).classList.remove("show");
    }

    for (const [tagId, person] of wanted) {
        const tag = byid(tagId);
        const name = String(person.name || "").trim();

        if (instant) tag.classList.add("no-anim");

        // A tag with no name stays off screen, the same as the shoutout. A desk
        // of two rather than three is just an empty Label.
        if (!name) { tag.classList.remove("show"); continue; }

        // An empty line is removed rather than left blank, and the three are
        // centred as a group, so a name on its own sits in the middle of the
        // panel instead of hanging at the top.
        const lines = [
            ["name", name],
            ["handle", atHandle(person.handle)],
            ["pronouns", String(person.pronouns || "").trim()],
        ];
        for (const [kind, value] of lines) {
            const span = byid(`${tagId}-${kind}`);
            span.parentElement.hidden = !value;
            if (value) fitName(span, value);
            else span.textContent = "";
        }

        tag.classList.add("show");
    }

    if (instant) {
        // Force the browser to apply the shown state before transitions are
        // allowed again, otherwise removing the class animates it after all.
        void byid(wanted[0][0]).offsetWidth;
        for (const tagId of ALL_TAGS) byid(tagId).classList.remove("no-anim");
    }
}

function hideTags() {
    for (const tagId of ALL_TAGS) byid(tagId).classList.remove("show");
}

// ── Toast ───────────────────────────────────────────────────────────────────
let toastTimers = [];

function clearToastTimers() {
    toastTimers.forEach(clearTimeout);
    toastTimers = [];
}

function showToast(g) {
    clearToastTimers();

    const text = String(g.text || "").trim();
    if (!text) return;

    byid("toast-text").textContent    = text;
    byid("toast-measure").textContent = text;

    const mark = byid("toast-mark");
    const body = byid("toast-body");
    const txt  = byid("toast-text");

    // Reset to hidden state before replaying
    mark.classList.remove("up");
    txt.classList.remove("show");
    body.style.width = "0px";

    // 1. mark slides up into the middle
    toastTimers.push(setTimeout(() => mark.classList.add("up"), 30));

    // 2. body stretches out from behind it to fit the text
    toastTimers.push(setTimeout(() => {
        const w = Math.min(1500, Math.ceil(byid("toast-measure").offsetWidth));
        body.style.width = w + "px";
    }, 430));

    // 3. text fades in once there is room for it
    toastTimers.push(setTimeout(() => txt.classList.add("show"), 690));

    const dur = Math.max(1000, Number(g.duration) || 8000);
    toastTimers.push(setTimeout(hideToast, 690 + dur));
}

function hideToast() {
    clearToastTimers();
    const mark = byid("toast-mark");
    const body = byid("toast-body");
    const txt  = byid("toast-text");

    // Reverse of the show sequence
    txt.classList.remove("show");
    toastTimers.push(setTimeout(() => { body.style.width = "0px"; }, 200));
    toastTimers.push(setTimeout(() => { mark.classList.remove("up"); }, 640));
}

// ── Timeout ─────────────────────────────────────────────────────────────────
// State comes from where the console already writes it, matches.timeout, so
// the Timeout panel did not have to change shape to get a graphic.
//
//   { left, right, atk: "left" | "right", side: "left" | "right",
//     visible, until }
//
// atk is which side is attacking, set in the console. side is who called this
// one. Those two together give the colour, red on attack and green on defence,
// without the operator having to think about it: the Stream Deck says attack
// or defence and the overlay works out which team that is.
//
// until is the moment a deck fired timeout comes down, as an absolute time
// rather than a countdown, so a browser source that reloads mid timeout comes
// back with the right amount of it left instead of starting the 58 again. A
// timeout raised by hand from the console has no until and stays up until the
// operator unticks it.

let timeoutUp = null;   // null until the first poll, so a reload can tell the
                        // difference between "already up" and "just raised"
let timeoutTimer = null;

function fillDots(prefix, count) {
    const n = Math.max(0, Math.min(2, Number(count) || 0));
    byid(prefix + "1").classList.toggle("on", n >= 1);
    byid(prefix + "2").classList.toggle("on", n >= 2);
}

function paintTimeout(to, game) {
    const el = byid("timeout");
    const right = to.side === "right";
    // Defending is simply "called it, and is not the attacking side".
    const defending = (to.atk === "right" ? "right" : "left") !== to.side;

    el.classList.toggle("def", defending);
    byid("to-side").textContent = defending ? "DEF" : "ATK";

    const tri = (right ? game.right_tri : game.left_tri)
        || (right ? game.right_tag : game.left_tag) || "";
    byid("to-tri").textContent = String(tri).trim().toUpperCase();

    const logo = right ? game.right_logo : game.left_logo;
    const logoEl = byid("to-logo");
    logoEl.style.backgroundImage = logo ? `url(${logo})` : "";
    logoEl.classList.toggle("empty", !logo);

    // Left dots are the left team's timeouts in hand, right the right team's,
    // whichever side called this one.
    fillDots("to-l", to.left);
    fillDots("to-r", to.right);
}

function applyTimeout(s) {
    const to = (s.matches && s.matches.timeout) || {};
    const game = ((s.matches && s.matches.matches) || {}).game1 || {};
    const el = byid("timeout");
    const until = Number(to.until) || 0;
    const left = until ? until - Math.floor(Date.now() / 1000) : 0;

    // An expired timeout is down, whatever the stored visible says. The state
    // is not rewritten when it ends, so this is what makes it end.
    const want = !!to.visible && (!until || left > 0);

    // Polling alone would leave it up to a second past its end. The timer is
    // what makes it come down on the second; the poll above is the backstop
    // if the tab was throttled or the state changed underneath it.
    clearTimeout(timeoutTimer);
    timeoutTimer = null;
    if (want && until) {
        timeoutTimer = setTimeout(() => {
            byid("timeout").classList.remove("up");
            timeoutUp = false;
        }, left * 1000);
    }

    // Repaint whenever it is up, so changing a count or a side while the
    // banner is on stream updates it rather than waiting for a hide and show.
    if (want) paintTimeout(to, game);

    if (timeoutUp === want) return;

    const first = timeoutUp === null;
    timeoutUp = want;

    if (first && !want) return;          // nothing on screen, nothing to do
    if (first) {
        // Up already when the source reloaded: come back without the animation.
        el.classList.add("instant", "up");
        void el.offsetWidth;             // commit before transitions return
        el.classList.remove("instant");
        return;
    }
    el.classList.toggle("up", want);
}

// ── D1 polling ──────────────────────────────────────────────────────────────
// Each graphic carries a `seq` counter. A change in seq means the operator
// pressed Show or Hide. The first poll after load only records the current
// seq so a browser-source refresh never replays the last graphic on stream.
const seen = { shoutout: null, toast: null, castertags: null, tagContent: null };

function applyGfx(s) {
    const preset = s.event_preset || "waveoce";
    document.documentElement.style.setProperty(
        "--brand-color",
        brandColors[preset] || brandColors.waveoce
    );

    const art = tagArt[preset] || tagArt.road2;
    document.documentElement.style.setProperty("--tag-art", `url("${art}")`);
    document.documentElement.style.setProperty(
        "--tag-handle", tagHandle[preset] || tagHandle.road2);

    const markSrc = brandMarks[preset] || brandMarks.waveoce;
    const markImg = byid("toast-mark-img");
    if (markImg.getAttribute("src") !== markSrc) markImg.src = markSrc;

    applyTimeout(s);

    const gfx = s.gfx || {};

    // The caster tags are a toggle rather than a timed graphic, so they are
    // handled apart from the two above. A timed graphic must NOT replay when
    // OBS reloads the source; a toggle that is up must come straight back, or
    // refreshing the browser source mid-show quietly drops it off stream.
    const tags = gfx.castertags || {};
    const tagSeq = Number(tags.seq) || 0;
    const camera = (s.matches || {}).camera || {};

    // What the tags should currently read. The seq only moves when somebody
    // presses Show or Hide, so on its own it would miss desk mode being
    // flipped and miss a name being corrected mid segment: both change what
    // belongs on screen without anybody touching the graphic.
    const tagContent = JSON.stringify(tagsFor(tags, camera).map(([id, p]) => [
        id, String(p.name || "").trim(),
        String(p.handle || "").trim(), String(p.pronouns || "").trim(),
    ]));

    if (seen.castertags === null) {
        seen.castertags = tagSeq;
        if (tags.on) showTags(tags, true, camera); else hideTags();
    } else if (tagSeq !== seen.castertags) {
        seen.castertags = tagSeq;
        if (tags.on) showTags(tags, false, camera); else hideTags();
    } else if (tags.on && tagContent !== seen.tagContent) {
        showTags(tags, false, camera);
    }
    seen.tagContent = tagContent;

    const handlers = {
        shoutout: [showShoutout, hideShoutout],
        toast:    [showToast,    hideToast],
    };

    for (const key of Object.keys(handlers)) {
        const g   = gfx[key] || {};
        const seq = Number(g.seq) || 0;

        if (seen[key] === null) { seen[key] = seq; continue; }
        if (seq === seen[key]) continue;

        seen[key] = seq;
        const [show, hide] = handlers[key];
        if (g.on) show(g); else hide();
    }
}

async function poll() {
    if (!accountId) return;
    try {
        const res = await fetch(`/api/overlay/${accountId}`, { cache: "no-store" });
        if (!res.ok) return;
        applyGfx(await res.json());
    } catch (e) {
        // network blip - next tick will pick it up
    }
}

setInterval(poll, 1000);
poll();
</script>

</body>
</html>
