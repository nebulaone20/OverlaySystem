<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Overlay System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0b0b; color: #fff; font-family: Arial, sans-serif; min-height: 100vh; }
  header {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; }
  header .right { display: flex; align-items: center; gap: 16px; }
  .badge { background: #0a69a4; border-radius: 6px; font-size: 12px; padding: 3px 10px; font-weight: 600; }
  .logout-btn {
    background: none;
    border: 1px solid #444;
    border-radius: 8px;
    color: #aaa;
    cursor: pointer;
    font-size: 13px;
    padding: 6px 14px;
  }
  .logout-btn:hover { border-color: #fff; color: #fff; }
  main { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  h2 { font-size: 20px; margin-bottom: 20px; }
  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 28px;
  }
  .card h3 { font-size: 15px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
  input {
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    min-width: 160px;
  }
  input:focus { border-color: #0a69a4; }
  .btn {
    background: #0a69a4;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 20px;
    white-space: nowrap;
  }
  .btn:hover { background: #0883cc; }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #e74c3c; }
  .btn.secondary { background: #2a2a2a; }
  .btn.secondary:hover { background: #333; }
  table { width: 100%; border-collapse: collapse; }
  th { color: #666; font-size: 12px; text-align: left; padding: 0 12px 10px; text-transform: uppercase; letter-spacing: 1px; }
  td { padding: 12px; border-top: 1px solid #1e1e1e; font-size: 14px; }
  td .mono { font-family: monospace; color: #888; font-size: 12px; }
  .actions { display: flex; gap: 8px; }
  .msg {
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    padding: 10px 14px;
    display: none;
  }
  .msg.ok { background: rgba(40,180,80,0.15); border: 1px solid rgba(40,180,80,0.3); color: #5dca7e; }
  .msg.err { background: rgba(220,50,50,0.15); border: 1px solid rgba(220,50,50,0.3); color: #ff6b6b; }
  .overlay-url {
    font-family: monospace;
    font-size: 12px;
    color: #0a69a4;
    cursor: pointer;
    text-decoration: underline;
  }

  /* Password reset modal */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 32px;
    width: 360px;
  }
  .modal h3 { margin-bottom: 16px; }
  .modal input { width: 100%; margin-bottom: 16px; }
  .modal .row { justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <h1>Overlay Admin</h1>
  <div class="right">
    <span class="badge">ADMIN</span>
    <span id="admin-name" style="color:#aaa;font-size:14px;"></span>
    <button class="logout-btn" id="logout-btn">Sign out</button>
  </div>
</header>

<main>
  <h2>Account Management</h2>

  <!-- Create account -->
  <div class="card">
    <h3>Create New Account</h3>
    <div class="msg" id="create-msg"></div>
    <div class="row">
      <div>
        <label>Display Name</label>
        <input type="text" id="new-display" placeholder="Wave OCE">
      </div>
      <div>
        <label>Username</label>
        <input type="text" id="new-username" placeholder="waveoce">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="new-password" placeholder="••••••••">
      </div>
      <button class="btn" id="create-btn">Create Account</button>
    </div>
  </div>

  <!-- Account list -->
  <div class="card">
    <h3>All Accounts</h3>
    <div class="msg" id="list-msg"></div>
    <table>
      <thead>
        <tr>
          <th>Display Name</th>
          <th>Username</th>
          <th>Account ID</th>
          <th>Overlay URL</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="account-list">
        <tr><td colspan="5" style="color:#555;text-align:center;padding:24px;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Password reset modal -->
<div class="modal-bg" id="pw-modal">
  <div class="modal">
    <h3>Reset Password</h3>
    <p style="color:#888;font-size:13px;margin-bottom:16px;">for <strong id="pw-modal-name"></strong></p>
    <input type="password" id="pw-new" placeholder="New password">
    <div class="row">
      <button class="btn secondary" id="pw-cancel">Cancel</button>
      <button class="btn" id="pw-save">Save Password</button>
    </div>
  </div>
</div>

<script>
  const API = "";
  const token = localStorage.getItem("overlay_token");
  const isAdmin = localStorage.getItem("overlay_is_admin") === "1";

  if (!token || !isAdmin) {
    window.location.href = "/login.html";
  }

  document.getElementById("admin-name").textContent = localStorage.getItem("overlay_username") || "";

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST", headers: { Authorization: "Bearer " + token } });
    localStorage.clear();
    window.location.href = "/login.html";
  });

  function authHeaders() {
    return { "Content-Type": "application/json", Authorization: "Bearer " + token };
  }

  function showMsg(id, text, type = "ok") {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `msg ${type}`;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 4000);
  }

  async function loadAccounts() {
    const res = await fetch("/api/admin/accounts", { headers: authHeaders() });
    const accounts = await res.json();
    const tbody = document.getElementById("account-list");
    if (!accounts.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="color:#555;text-align:center;padding:24px;">No accounts yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = accounts.map(a => {
      const overlayUrl = `${location.origin}/overlay/index.html?id=${a.id}`;
      const isAdminRow = a.id === "admin";
      return `
        <tr>
          <td>${a.display_name}</td>
          <td>${a.username}</td>
          <td class="mono">${a.id}</td>
          <td><span class="overlay-url" onclick="navigator.clipboard.writeText('${overlayUrl}').then(()=>alert('Copied!'))">${overlayUrl}</span></td>
          <td>
            <div class="actions">
              <button class="btn secondary" onclick="openPwModal('${a.id}','${a.display_name}')">Reset PW</button>
              ${!isAdminRow ? `<button class="btn danger" onclick="deleteAccount('${a.id}','${a.display_name}')">Delete</button>` : ""}
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  document.getElementById("create-btn").addEventListener("click", async () => {
    const displayName = document.getElementById("new-display").value.trim();
    const username = document.getElementById("new-username").value.trim();
    const password = document.getElementById("new-password").value;

    if (!displayName || !username || !password) {
      showMsg("create-msg", "All fields required.", "err");
      return;
    }

    const res = await fetch("/api/admin/accounts", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({ displayName, username, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg("create-msg", data.error || "Failed to create.", "err");
      return;
    }

    showMsg("create-msg", `Account "${username}" created. ID: ${data.id}`);
    document.getElementById("new-display").value = "";
    document.getElementById("new-username").value = "";
    document.getElementById("new-password").value = "";
    loadAccounts();
  });

  async function deleteAccount(id, name) {
    if (!confirm(`Delete account "${name}"? This cannot be undone.`)) return;
    const res = await fetch(`/api/admin/accounts/${id}`, {
      method: "DELETE",
      headers: authHeaders(),
    });
    if (res.ok) {
      showMsg("list-msg", `Deleted "${name}".`);
      loadAccounts();
    } else {
      showMsg("list-msg", "Delete failed.", "err");
    }
  }

  let pwTargetId = null;
  function openPwModal(id, name) {
    pwTargetId = id;
    document.getElementById("pw-modal-name").textContent = name;
    document.getElementById("pw-new").value = "";
    document.getElementById("pw-modal").classList.add("open");
  }

  document.getElementById("pw-cancel").addEventListener("click", () => {
    document.getElementById("pw-modal").classList.remove("open");
  });

  document.getElementById("pw-save").addEventListener("click", async () => {
    const password = document.getElementById("pw-new").value;
    if (!password) return;
    const res = await fetch(`/api/admin/accounts/${pwTargetId}/password`, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify({ password }),
    });
    document.getElementById("pw-modal").classList.remove("open");
    if (res.ok) {
      showMsg("list-msg", "Password updated.");
    } else {
      showMsg("list-msg", "Failed to update password.", "err");
    }
  });

  loadAccounts();
</script>
</body>
</html>
