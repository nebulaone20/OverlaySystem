<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  #cam-container {
    width: 1920px;
    height: 1080px;
    position: relative;
  }
  .cam-iframe {
    border: none;
    background: transparent;
    display: block;
    position: absolute;
  }
  .cam-bg {
    position: absolute;
    background: #6F068E; /* matches the frame artwork's interior fill */
    z-index: 1;
  }
  .cam-iframe { z-index: 2; }
  .frame-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
    z-index: 3;
  }
  /* Frame windows read from the preset's cam frames (1920x1080
     canvas): 798x436 inner opening. The video itself is sized to true
     16:9 (775x436) and centered inside that opening so nothing is
     cropped or stretched; cam-bg fills the ~11px pillarbox either side. */
  .cam-bg.solo, .cam-iframe.solo           { top: 206px; height: 436px; }
  .cam-bg.duo-left, .cam-iframe.duo-left   { top: 206px; height: 436px; }
  .cam-bg.duo-right, .cam-iframe.duo-right { top: 206px; height: 436px; }

  .cam-bg.solo      { left: 549px;  width: 798px; }
  .cam-bg.duo-left  { left: 76px;   width: 798px; }
  .cam-bg.duo-right { left: 1023px; width: 798px; }

  .cam-iframe.solo      { left: 560.5px;  width: 775px; }
  .cam-iframe.duo-left  { left: 87.5px;   width: 775px; }
  .cam-iframe.duo-right { left: 1034.5px; width: 775px; }

  /* Desk: three windows, measured off TripleCamDAWN-blue.png rather than
     assumed, which is why the third is not the same as the other two. It is
     13px narrower and 5px taller in the artwork itself.

     These windows are portrait, unlike the duo openings which are nearly 16:9.
     A webcam cannot fit a portrait box without either huge bars or a crop, so
     the video fills the window and pull.html's object-fit: cover takes a
     centre column of the shot. Heads sit fine; shoulders lose their edges. */
  .cam-bg.desk-1, .cam-iframe.desk-1 { left: 170px;  top: 248px; width: 458px; height: 513px; }
  .cam-bg.desk-2, .cam-iframe.desk-2 { left: 735px;  top: 248px; width: 458px; height: 513px; }
  .cam-bg.desk-3, .cam-iframe.desk-3 { left: 1306px; top: 248px; width: 445px; height: 518px; }
</style>
</head>
<body>
<div id="cam-container"></div>

<script>
  const qs = new URLSearchParams(location.search);
  const accountId = qs.get("id");
  if (!accountId) {
    document.body.innerHTML = "<p style='color:red;padding:40px;font-size:24px;'>Missing ?id= in URL</p>";
  }

  // Two views out of one file. Without ?view=desk this is the caster source
  // and behaves exactly as it always has, following the Layout dropdown. With
  // it, this is the desk source: three windows, shown only while desk mode is
  // ticked, and it ignores Layout entirely. They are separate OBS sources so
  // either can be on screen without the other.
  const isDeskView = qs.get("view") === "desk";
  const DESK_SLOTS = ["desk1", "desk2", "desk3"];

  let prevLayout = null;
  let prevLeftUrl = null;
  let prevRightUrl = null;
  let prevSoloUrl = null;
  let prevPreset = null;

  // Track last applied audio per side to avoid spamming postMessage
  let lastAudio = { left: {}, right: {}, solo: {}, desk1: {}, desk2: {}, desk3: {} };
  const noAudio = () => ({ left: {}, right: {}, solo: {}, desk1: {}, desk2: {}, desk3: {} });
  let prevDeskUrls = null;

  // Cam frames per event preset. Anything without an entry falls back to INV.
  const frameSets = {
    road2: {
      duo: "DuoCamDAWN-blue.png",
      solo: "SingleCamDAWN-blue.png",
      desk: "TripleCamDAWN-blue.png",
    },
  };
  const defaultFrames = { duo: "DuoCamINV.png", solo: "SingleCamINV.png" };

  function frameFor(preset, layout) {
    const set = frameSets[preset] || defaultFrames;
    return "/castcams/frames/" + encodeURIComponent(set[layout] || defaultFrames[layout]);
  }

  function buildViewUrl(slot) {
    const p = new URLSearchParams({ id: accountId, slot });
    return "/cam/pull.html?" + p.toString();
  }

  function sendAudio(iframe, side, cam) {
    if (!iframe || !iframe.contentWindow) return;
    const volume = cam.mute ? 0 : Math.round((cam.volume ?? 1) * 100);
    const panning = cam.panning ?? 0;

    // Only send if changed
    if (lastAudio[side].volume !== volume) {
      iframe.contentWindow.postMessage({ volume }, "*");
      lastAudio[side].volume = volume;
    }
    if (lastAudio[side].panning !== panning) {
      iframe.contentWindow.postMessage({ panning }, "*");
      lastAudio[side].panning = panning;
    }
  }

  function applyLayout(s) {
    const container = document.getElementById("cam-container");
    const cam = (s.matches || {}).camera || {};
    const layout = cam.layout || "none";
    const cams = cam.cams || {};
    const preset = s.event_preset || "waveoce";

    if (isDeskView) {
      // Off unless desk mode is on, so the source can sit in a scene without
      // showing three empty windows between segments.
      if (!cam.desk) {
        if (prevLayout !== "off") {
          container.innerHTML = "";
          prevLayout = "off";
          prevDeskUrls = null;
          lastAudio = noAudio();
        }
        return;
      }

      const urls = DESK_SLOTS.map(buildViewUrl);
      const key = urls.join("|");
      if (prevLayout !== "desk" || prevDeskUrls !== key || prevPreset !== preset) {
        container.innerHTML = DESK_SLOTS.map((slot, i) => `
          <div class="cam-bg desk-${i + 1}"></div>
          <iframe id="iframe-${slot}" class="cam-iframe desk-${i + 1}"
                  src="${urls[i] || "about:blank"}" allow="autoplay;fullscreen"></iframe>`).join("")
          + `<img class="frame-img" src="${frameFor(preset, "desk")}" alt="">`;
        prevLayout   = "desk";
        prevPreset   = preset;
        prevDeskUrls = key;
        lastAudio    = noAudio();
      }

      for (const slot of DESK_SLOTS) {
        const frame = document.getElementById("iframe-" + slot);
        if (frame) sendAudio(frame, slot, cams[slot] || {});
      }
      return;
    }

    if (layout === "none") {
      container.innerHTML = "";
      prevLayout = "none";
      lastAudio = noAudio();
      return;
    }

    if (layout === "duo") {
      const leftUrl  = buildViewUrl("left");
      const rightUrl = buildViewUrl("right");

      if (prevLayout !== "duo" || prevLeftUrl !== leftUrl || prevRightUrl !== rightUrl
          || prevPreset !== preset) {
        container.innerHTML = `
          <div class="cam-bg duo-left"></div>
          <div class="cam-bg duo-right"></div>
          <iframe id="iframe-left"  class="cam-iframe duo-left"  src="${leftUrl  || "about:blank"}" allow="autoplay;fullscreen"></iframe>
          <iframe id="iframe-right" class="cam-iframe duo-right" src="${rightUrl || "about:blank"}" allow="autoplay;fullscreen"></iframe>
          <img class="frame-img" src="${frameFor(preset, "duo")}" alt="">`;
        prevLayout   = "duo";
        prevPreset   = preset;
        prevLeftUrl  = leftUrl;
        prevRightUrl = rightUrl;
        lastAudio    = noAudio();
      }

      // Real-time audio
      const iLeft  = document.getElementById("iframe-left");
      const iRight = document.getElementById("iframe-right");
      if (iLeft)  sendAudio(iLeft,  "left",  cams.left  || {});
      if (iRight) sendAudio(iRight, "right", cams.right || {});
    }

    if (layout === "solo") {
      const soloSide = cam.solo || "left";
      const soloCam  = cams[soloSide] || {};
      const soloUrl  = buildViewUrl(soloSide);

      if (prevLayout !== "solo" || prevSoloUrl !== soloUrl || prevPreset !== preset) {
        container.innerHTML = `
          <div class="cam-bg solo"></div>
          <iframe id="iframe-solo" class="cam-iframe solo" src="${soloUrl || "about:blank"}" allow="autoplay;fullscreen"></iframe>
          <img class="frame-img" src="${frameFor(preset, "solo")}" alt="">`;
        prevLayout  = "solo";
        prevPreset  = preset;
        prevSoloUrl = soloUrl;
        lastAudio   = noAudio();
      }

      const iSolo = document.getElementById("iframe-solo");
      if (iSolo) sendAudio(iSolo, "solo", soloCam);
    }
  }

  async function poll() {
    try {
      const res = await fetch(`/api/overlay/${accountId}`);
      if (!res.ok) return;
      const s = await res.json();
      applyLayout(s);
    } catch (e) {
      console.warn("Poll error:", e);
    }
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
