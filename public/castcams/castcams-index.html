<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  #cam-container {
    width: 1920px;
    height: 1080px;
    position: relative;
  }
  .cam-iframe {
    border: none;
    background: transparent;
    display: block;
    position: absolute;
  }
  .cam-bg {
    position: absolute;
    background: #6F068E; /* matches the frame artwork's interior fill */
    z-index: 1;
  }
  .cam-iframe { z-index: 2; }
  .frame-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
    z-index: 3;
  }
  /* Frame windows read from SingleCamINV.png / DuoCamINV.png (1920x1080
     canvas): 798x436 inner opening. The video itself is sized to true
     16:9 (775x436) and centered inside that opening so nothing is
     cropped or stretched; cam-bg fills the ~11px pillarbox either side. */
  .cam-bg.solo, .cam-iframe.solo           { top: 206px; height: 436px; }
  .cam-bg.duo-left, .cam-iframe.duo-left   { top: 206px; height: 436px; }
  .cam-bg.duo-right, .cam-iframe.duo-right { top: 206px; height: 436px; }

  .cam-bg.solo      { left: 549px;  width: 798px; }
  .cam-bg.duo-left  { left: 76px;   width: 798px; }
  .cam-bg.duo-right { left: 1023px; width: 798px; }

  .cam-iframe.solo      { left: 560.5px;  width: 775px; }
  .cam-iframe.duo-left  { left: 87.5px;   width: 775px; }
  .cam-iframe.duo-right { left: 1034.5px; width: 775px; }
</style>
</head>
<body>
<div id="cam-container"></div>

<script>
  const accountId = new URLSearchParams(location.search).get("id");
  if (!accountId) {
    document.body.innerHTML = "<p style='color:red;padding:40px;font-size:24px;'>Missing ?id= in URL</p>";
  }

  let prevLayout = null;
  let prevLeftUrl = null;
  let prevRightUrl = null;
  let prevSoloUrl = null;

  // Track last applied audio per side to avoid spamming postMessage
  let lastAudio = { left: {}, right: {}, solo: {} };

  function buildViewUrl(slot) {
    const p = new URLSearchParams({ id: accountId, slot });
    return "/cam/pull.html?" + p.toString();
  }

  function sendAudio(iframe, side, cam) {
    if (!iframe || !iframe.contentWindow) return;
    const volume = cam.mute ? 0 : Math.round((cam.volume ?? 1) * 100);
    const panning = cam.panning ?? 0;

    // Only send if changed
    if (lastAudio[side].volume !== volume) {
      iframe.contentWindow.postMessage({ volume }, "*");
      lastAudio[side].volume = volume;
    }
    if (lastAudio[side].panning !== panning) {
      iframe.contentWindow.postMessage({ panning }, "*");
      lastAudio[side].panning = panning;
    }
  }

  function applyLayout(s) {
    const container = document.getElementById("cam-container");
    const cam = (s.matches || {}).camera || {};
    const layout = cam.layout || "none";
    const cams = cam.cams || {};

    if (layout === "none") {
      container.innerHTML = "";
      prevLayout = "none";
      lastAudio = { left: {}, right: {}, solo: {} };
      return;
    }

    if (layout === "duo") {
      const leftUrl  = buildViewUrl("left");
      const rightUrl = buildViewUrl("right");

      if (prevLayout !== "duo" || prevLeftUrl !== leftUrl || prevRightUrl !== rightUrl) {
        container.innerHTML = `
          <div class="cam-bg duo-left"></div>
          <div class="cam-bg duo-right"></div>
          <iframe id="iframe-left"  class="cam-iframe duo-left"  src="${leftUrl  || "about:blank"}" allow="autoplay;fullscreen"></iframe>
          <iframe id="iframe-right" class="cam-iframe duo-right" src="${rightUrl || "about:blank"}" allow="autoplay;fullscreen"></iframe>
          <img class="frame-img" src="/castcams/frames/DuoCamINV.png" alt="">`;
        prevLayout   = "duo";
        prevLeftUrl  = leftUrl;
        prevRightUrl = rightUrl;
        lastAudio    = { left: {}, right: {}, solo: {} };
      }

      // Real-time audio
      const iLeft  = document.getElementById("iframe-left");
      const iRight = document.getElementById("iframe-right");
      if (iLeft)  sendAudio(iLeft,  "left",  cams.left  || {});
      if (iRight) sendAudio(iRight, "right", cams.right || {});
    }

    if (layout === "solo") {
      const soloSide = cam.solo || "left";
      const soloCam  = cams[soloSide] || {};
      const soloUrl  = buildViewUrl(soloSide);

      if (prevLayout !== "solo" || prevSoloUrl !== soloUrl) {
        container.innerHTML = `
          <div class="cam-bg solo"></div>
          <iframe id="iframe-solo" class="cam-iframe solo" src="${soloUrl || "about:blank"}" allow="autoplay;fullscreen"></iframe>
          <img class="frame-img" src="/castcams/frames/SingleCamINV.png" alt="">`;
        prevLayout  = "solo";
        prevSoloUrl = soloUrl;
        lastAudio   = { left: {}, right: {}, solo: {} };
      }

      const iSolo = document.getElementById("iframe-solo");
      if (iSolo) sendAudio(iSolo, "solo", soloCam);
    }
  }

  async function poll() {
    try {
      const res = await fetch(`/api/overlay/${accountId}`);
      if (!res.ok) return;
      const s = await res.json();
      applyLayout(s);
    } catch (e) {
      console.warn("Poll error:", e);
    }
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
