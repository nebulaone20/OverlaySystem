<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay System - Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b0b;
    color: #fff;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 40px;
    width: 360px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: #888; font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    padding: 10px 14px;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: #0a69a4; }
  button {
    width: 100%;
    background: #0a69a4;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #0883cc; }
  .error {
    background: rgba(220,50,50,0.15);
    border: 1px solid rgba(220,50,50,0.3);
    border-radius: 8px;
    color: #ff6b6b;
    font-size: 13px;
    padding: 10px 14px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Overlay Login</h1>
  <p class="sub">Sign in to manage your overlay</p>
  <div class="error" id="error-msg"></div>
  <label>Username</label>
  <input type="text" id="username" autocomplete="username" placeholder="username">
  <label>Password</label>
  <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
  <button id="login-btn">Sign In</button>
</div>

<script>
  const API = ""; // same origin

  async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errEl = document.getElementById("error-msg");
    errEl.style.display = "none";

    if (!username || !password) {
      errEl.textContent = "Please enter username and password.";
      errEl.style.display = "block";
      return;
    }

    try {
      const res = await fetch(`${API}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.error || "Login failed.";
        errEl.style.display = "block";
        return;
      }

      localStorage.setItem("overlay_token", data.token);
      localStorage.setItem("overlay_account_id", data.accountId);
      localStorage.setItem("overlay_username", data.username);
      localStorage.setItem("overlay_is_admin", data.isAdmin ? "1" : "0");

      if (data.isAdmin) {
        window.location.href = "/admin.html";
      } else {
        window.location.href = "/console/index.html";
      }
    } catch (e) {
      errEl.textContent = "Network error. Try again.";
      errEl.style.display = "block";
    }
  }

  document.getElementById("login-btn").addEventListener("click", login);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") login();
  });

  // Redirect if already logged in
  (async () => {
    const token = localStorage.getItem("overlay_token");
    if (!token) return;
    const res = await fetch("/api/me", {
      headers: { Authorization: "Bearer " + token },
    });
    if (res.ok) {
      const me = await res.json();
      window.location.href = me.isAdmin ? "/admin.html" : "/console/index.html";
    }
  })();
</script>
</body>
</html>
